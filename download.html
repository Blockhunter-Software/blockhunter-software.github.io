<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       HOW TO USE THIS TEMPLATE
       -----------------------------------------------------------------------
       Load product data via URL hash:
         download.html#diary       → loads data/diary.json
         download.html#myapp       → loads data/myapp.json

       JSON format (see data/diary.json for a full example):
       {
         "name":        "App Name",
         "version":     "v1.0.0",
         "description": "...",
         "logo":        "assets/app.png",   // optional – falls back to logo_emoji
         "logo_emoji":  "📦",
         "platforms": {
           "windows": { "active": true,  "link": "downloads/app_win.zip" },
           "mac":     { "active": false, "link": "" },
           "linux":   { "active": true,  "link": "downloads/app_linux.zip" },
           "ios":     { "active": false, "link": "" },
           "android": { "active": false, "link": "" }
         },
         "features": [
           { "icon": "🔒", "title": "Encrypted", "description": "..." }
         ],
         "screenshots": [],        // array of image paths (optional)
         "requirements": [
           { "component": "OS", "min": "Windows 10", "recommended": "Windows 11" }
         ],
         "footer": "© 2025 Acme · <a href='#'>GitHub</a>"
       }

       LANGUAGE / i18n
       -----------------------------------------------------------------------
       Edit the LANG object below to translate all UI strings.
       Switch language at runtime: window.setLang('de')
       To add a new language, duplicate any existing block.
    ===================================================================== */

    /* =====================================================================
       DESIGN TOKENS  (inherited from Blockhunter main site)
    ===================================================================== */
    :root {
      --bg:          #0A0A0F;
      --bg-2:        #111118;
      --surface:     #16161F;
      --surface-2:   #1E1E2A;
      --border:      #2A2A3E;
      --border-2:    #383850;

      --text-primary:   #F0F0F5;
      --text-secondary: #9090A8;
      --text-muted:     #5A5A72;

      --accent:      #6B7BFF;
      --accent-dim:  rgba(107, 123, 255, 0.15);
      --accent-glow: rgba(107, 123, 255, 0.35);

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;

      --font-display: 'Space Grotesk', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'Space Mono', monospace;

      --transition:      0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg:          #F5F5FA;
      --bg-2:        #EBEBF2;
      --surface:     #FFFFFF;
      --surface-2:   #F0F0F7;
      --border:      #D8D8E8;
      --border-2:    #C0C0D8;
      --text-primary:   #0A0A18;
      --text-secondary: #484860;
      --text-muted:     #9090A8;
    }

    /* =====================================================================
       RESET & BASE
    ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background var(--transition-slow), color var(--transition-slow);
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; font-family: var(--font-body); border: none; background: none; }

    /* =====================================================================
       NAV
    ===================================================================== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition-slow);
    }
    [data-theme="light"] nav { background: rgba(245,245,250,0.88); }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.7rem; font-weight: 700;
      color: #fff;
    }

    .btn-theme {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--surface);
      transition: color var(--transition), border-color var(--transition);
    }
    .btn-theme:hover { color: var(--text-primary); border-color: var(--border-2); }
    .btn-theme svg { width: 16px; height: 16px; }

    /* =====================================================================
       LOADING / ERROR STATES
    ===================================================================== */
    #state-loading, #state-error {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px 24px;
    }
    #state-error { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-code {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
    }

    /* =====================================================================
       MAIN CONTENT  (hidden until data loads)
    ===================================================================== */
    #app { display: none; }
    #app.loaded { display: block; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* =====================================================================
       HERO
    ===================================================================== */
    .hero {
      padding: 120px 0 72px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.4;
    }

    .hero-inner {
      display: flex;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .app-icon {
      width: 100px; height: 100px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 0 40px var(--accent-dim);
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .hero-text { flex: 1; min-width: 260px; }

    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(107,123,255,0.3);
      border-radius: 40px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }
    .version-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    /* =====================================================================
       DOWNLOAD BUTTONS
    ===================================================================== */
    .download-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn-download svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* Primary — detected OS */
    .btn-download.primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .btn-download.primary:hover {
      background: #7B8BFF;
      box-shadow: 0 0 36px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Secondary — other available platforms */
    .btn-download.secondary {
      background: var(--surface);
      color: var(--text-primary);
      border-color: var(--border);
    }
    .btn-download.secondary:hover {
      background: var(--surface-2);
      border-color: var(--border-2);
      transform: translateY(-1px);
    }

    /* Unavailable */
    .btn-download.unavailable {
      background: var(--surface);
      color: var(--text-muted);
      border-color: var(--border);
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-label-sub {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      opacity: 0.65;
      font-weight: 400;
      display: block;
      line-height: 1;
      margin-top: 1px;
    }

    /* =====================================================================
       PLATFORM AVAILABILITY STRIP
    ===================================================================== */
    .platforms-strip {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .platforms-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 40px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      border: 1px solid var(--border);
    }
    .platform-chip.available {
      color: #5EFFA0;
      background: rgba(94,255,160,0.06);
      border-color: rgba(94,255,160,0.25);
    }
    .platform-chip.unavailable {
      color: var(--text-muted);
      background: transparent;
    }
    .chip-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
    }
    .platform-chip.available .chip-dot { background: #5EFFA0; }
    .platform-chip.unavailable .chip-dot { background: var(--text-muted); }

    /* =====================================================================
       SECTION SHARED
    ===================================================================== */
    section { padding: 72px 0; border-top: 1px solid var(--border); }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 48px;
    }

    /* =====================================================================
       FEATURES GRID
    ===================================================================== */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      transition: border-color var(--transition), transform var(--transition);
    }
    .feature-card:hover {
      border-color: var(--border-2);
      transform: translateY(-2px);
    }
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 14px;
      line-height: 1;
    }
    .feature-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .feature-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* =====================================================================
       SCREENSHOTS
    ===================================================================== */
    .screenshots-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .screenshot-frame {
      flex-shrink: 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface);
      height: 260px;
      cursor: zoom-in;
      transition: border-color var(--transition);
    }
    .screenshot-frame:hover { border-color: var(--border-2); }
    .screenshot-frame img { height: 100%; width: auto; display: block; }

    /* =====================================================================
       REQUIREMENTS TABLE
    ===================================================================== */
    .req-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .req-table th {
      text-align: left;
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .req-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .req-table td:first-child {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--text-primary);
    }
    .req-table tr:last-child td { border-bottom: none; }
    .req-table tbody tr:hover td { background: var(--surface-2); }

    .req-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* =====================================================================
       FOOTER
    ===================================================================== */
    footer {
      padding: 32px 0;
      border-top: 1px solid var(--border);
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .footer-copy a {
      color: var(--accent);
      transition: opacity var(--transition);
    }
    .footer-copy a:hover { opacity: 0.75; }

    /* =====================================================================
       LIGHTBOX
    ===================================================================== */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition);
    }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox img {
      max-width: 90vw; max-height: 88vh;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }
    .lightbox-close {
      position: fixed; top: 20px; right: 24px;
      width: 40px; height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: color var(--transition);
    }
    .lightbox-close:hover { color: var(--text-primary); }

    /* =====================================================================
       RESPONSIVE
    ===================================================================== */
    @media (max-width: 640px) {
      .hero { padding: 100px 0 56px; }
      .app-icon { width: 80px; height: 80px; font-size: 2.4rem; }
      .features-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ================================================================
       NAV
  ================================================================ -->
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="logo-mark">BH</div>
        <span>Blockhunter Software</span>
      </a>
      <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <!-- ================================================================
       LOADING STATE
  ================================================================ -->
  <div id="state-loading">
    <div class="spinner"></div>
    <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.8rem;" id="loading-msg">Loading…</p>
  </div>

  <!-- ================================================================
       ERROR STATE
  ================================================================ -->
  <div id="state-error">
    <div style="font-size:2.5rem;margin-bottom:8px;">⚠️</div>
    <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:8px;" id="err-title">Could not load product</h2>
    <p style="color:var(--text-secondary);margin-bottom:16px;" id="err-body">Make sure the URL hash points to a valid JSON file.</p>
    <span class="error-code" id="err-detail"></span>
  </div>

  <!-- ================================================================
       MAIN APP  (injected by JS)
  ================================================================ -->
  <div id="app"></div>

  <!-- ================================================================
       LIGHTBOX
  ================================================================ -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="Screenshot" />
  </div>

  <!-- ================================================================
       SCRIPT
  ================================================================ -->
  <script>
    /* ──────────────────────────────────────────────────────────────────
       LANGUAGE / i18n
       To add a language: copy an existing block, change the key (e.g.
       "de"), translate every string, then call setLang("de").
    ────────────────────────────────────────────────────────────────── */
    const LANGS = {
      en: {
        loading:         "Loading…",
        noHash:          "No product specified",
        noHashBody:      "Add a hash to the URL: download.html#yourapp",
        fetchFail:       "Failed to load product data",
        fetchFailBody:   "Check the console for details.",
        detected:        "Detected OS",
        downloadFor:     "Download for",
        alsoAvailable:   "Also available for",
        notAvailable:    "Not available for",
        primaryBtn:      (os) => `Download for ${PLATFORM_LABELS[os]}`,
        secondaryBtn:    (os) => `${PLATFORM_LABELS[os]}`,
        unavailableBtn:  (os) => `${PLATFORM_LABELS[os]} — unavailable`,
        features:        "Features",
        featuresLabel:   "What's included",
        screenshots:     "Screenshots",
        screenshotsLabel:"Preview",
        requirements:    "System Requirements",
        requirementsLabel:"Minimum & recommended",
        component:       "Component",
        minimum:         "Minimum",
        recommended:     "Recommended",
        available:       "Available",
        unavailable:     "Unavailable",
        platforms:       "Platforms",
      },
      de: {
        loading:         "Lädt…",
        noHash:          "Kein Produkt angegeben",
        noHashBody:      "Füge einen Hash zur URL hinzu: download.html#deinapp",
        fetchFail:       "Produktdaten konnten nicht geladen werden",
        fetchFailBody:   "Prüfe die Konsole für Details.",
        detected:        "Erkanntes Betriebssystem",
        downloadFor:     "Herunterladen für",
        alsoAvailable:   "Auch verfügbar für",
        notAvailable:    "Nicht verfügbar für",
        primaryBtn:      (os) => `Herunterladen für ${PLATFORM_LABELS[os]}`,
        secondaryBtn:    (os) => `${PLATFORM_LABELS[os]}`,
        unavailableBtn:  (os) => `${PLATFORM_LABELS[os]} — nicht verfügbar`,
        features:        "Funktionen",
        featuresLabel:   "Was enthalten ist",
        screenshots:     "Screenshots",
        screenshotsLabel:"Vorschau",
        requirements:    "Systemanforderungen",
        requirementsLabel:"Minimum & empfohlen",
        component:       "Komponente",
        minimum:         "Minimum",
        recommended:     "Empfohlen",
        available:       "Verfügbar",
        unavailable:     "Nicht verfügbar",
        platforms:       "Plattformen",
      }
      /* ── add more languages here ── */
    };

    /* Active language — change this or call setLang() at runtime */
    let activeLang = 'en';
    function t(key, ...args) {
      const entry = (LANGS[activeLang] || LANGS['en'])[key];
      return typeof entry === 'function' ? entry(...args) : (entry || key);
    }
    window.setLang = function(code) {
      if (LANGS[code]) { activeLang = code; renderApp(window._appData); }
    };

    /* ──────────────────────────────────────────────────────────────────
       PLATFORM CONFIG
       SVG icons + display labels for every supported OS.
       To add a new platform: add an entry here and in your JSON.
    ────────────────────────────────────────────────────────────────── */
    const PLATFORM_LABELS = {
      windows: 'Windows',
      mac:     'macOS',
      linux:   'Linux',
      ios:     'iOS',
      android: 'Android',
    };

    const PLATFORM_ICONS = {
      windows: `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-13.051-1.801"/></svg>`,
      mac:     `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>`,
      linux:   `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M20.581 19.049c-.55-.446-.467-.928-.376-1.552.06-.41.122-.835.055-1.273-.149-1.012-.868-1.892-2.106-2.609-.898-.517-1.352-1.14-1.418-1.955a3.289 3.289 0 0 1 .045-.876c.167-1.103.334-2.204-.274-3.232-.827-1.402-2.342-1.827-3.797-1.827-1.449 0-2.965.425-3.793 1.827-.608 1.028-.441 2.129-.274 3.232a3.36 3.36 0 0 1 .046.876c-.067.815-.52 1.438-1.418 1.955-1.238.717-1.956 1.597-2.106 2.609-.067.438-.005.863.055 1.273.091.624.174 1.106-.376 1.552-.232.188-.479.563-.373 1.229.07.44.364.922.576 1.049 2.18 1.319 3.908 2.169 5.706 2.169.326 0 .658-.029.997-.086.228-.039.465-.059.71-.059.246 0 .483.02.71.059.34.057.671.086.997.086 1.797 0 3.526-.85 5.706-2.169.212-.127.506-.609.576-1.049.107-.666-.14-1.04-.37-1.229zM12 1.996c.972 0 1.76.787 1.76 1.759 0 .973-.788 1.76-1.76 1.76-.973 0-1.76-.787-1.76-1.76 0-.972.787-1.759 1.76-1.759z"/></svg>`,
      ios:     `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`,
      android: `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4483-.9993.9993-.9993c.5511 0 .9993.4483.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4483.9993.9993 0 .5511-.4483.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 0 0-.1521-.5676.416.416 0 0 0-.5676.1521l-2.0223 3.503C15.5902 8.2439 13.8533 7.8508 12 7.8508s-3.5902.3931-5.1367 1.0729L4.841 5.4207a.4159.4159 0 0 0-.5677-.1521.4157.4157 0 0 0-.1521.5676l1.9973 3.4592C2.6889 10.1305.3432 13.4098 0 17.3995h24c-.3432-3.9897-2.6889-7.2691-6.1185-8.0781"/></svg>`,
    };

    /* ──────────────────────────────────────────────────────────────────
       OS DETECTION
    ────────────────────────────────────────────────────────────────── */
    function detectOS() {
      const ua = navigator.userAgent.toLowerCase();
      const platform = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
      if (/iphone|ipad|ipod/.test(ua)) return 'ios';
      if (/android/.test(ua))          return 'android';
      if (/mac/.test(platform) || /mac/.test(ua)) return 'mac';
      if (/linux/.test(platform) || /linux/.test(ua)) return 'linux';
      return 'windows'; // default
    }

    /* ──────────────────────────────────────────────────────────────────
       RENDER
    ────────────────────────────────────────────────────────────────── */
    function renderApp(data) {
      window._appData = data;
      const detectedOS  = detectOS();
      const platforms   = data.platforms || {};
      const platformKeys = Object.keys(PLATFORM_LABELS);

      /* Update page title */
      document.title = `${data.name} — Download`;

      /* Build download buttons */
      const primaryOS = platforms[detectedOS]?.active ? detectedOS : 'windows';
      let buttonsHTML = '';

      // Primary button — detected OS (or Windows fallback)
      const primPlat = platforms[primaryOS];
      if (primPlat?.active && primPlat?.link) {
        buttonsHTML += `
          <a href="${primPlat.link}" class="btn-download primary" download>
            ${PLATFORM_ICONS[primaryOS] || ''}
            <span>
              ${t('primaryBtn', primaryOS)}
              <span class="btn-label-sub">${data.version}</span>
            </span>
          </a>`;
      }

      // Secondary buttons — other available platforms
      platformKeys
        .filter(os => os !== primaryOS)
        .forEach(os => {
          const p = platforms[os];
          if (!p) return;
          if (p.active && p.link) {
            buttonsHTML += `
              <a href="${p.link}" class="btn-download secondary" download>
                ${PLATFORM_ICONS[os] || ''}
                <span>${t('secondaryBtn', os)}</span>
              </a>`;
          } else {
            buttonsHTML += `
              <span class="btn-download unavailable" title="${t('notAvailable')} ${PLATFORM_LABELS[os]}">
                ${PLATFORM_ICONS[os] || ''}
                <span>${t('unavailableBtn', os)}</span>
              </span>`;
          }
        });

      /* Platform availability chips */
      const chipsHTML = platformKeys.map(os => {
        const p = platforms[os];
        const avail = p?.active;
        return `<span class="platform-chip ${avail ? 'available' : 'unavailable'}">
          <span class="chip-dot"></span>${PLATFORM_LABELS[os]}
        </span>`;
      }).join('');

      /* Features */
      const features = (data.features || []).map(f => `
        <div class="feature-card">
          <div class="feature-icon">${f.icon || '✦'}</div>
          <div class="feature-title">${f.title}</div>
          <div class="feature-desc">${f.description}</div>
        </div>`).join('');

      /* Screenshots */
      let screenshotsSection = '';
      if (data.screenshots && data.screenshots.length > 0) {
        const imgs = data.screenshots.map(src => `
          <div class="screenshot-frame" onclick="openLightbox('${src}')">
            <img src="${src}" alt="Screenshot" loading="lazy" />
          </div>`).join('');
        screenshotsSection = `
          <section>
            <div class="container">
              <div class="section-label">${t('screenshotsLabel')}</div>
              <div class="section-title">${t('screenshots')}</div>
              <div class="screenshots-scroll">${imgs}</div>
            </div>
          </section>`;
      }

      /* Requirements */
      let reqSection = '';
      if (data.requirements && data.requirements.length > 0) {
        const rows = data.requirements.map(r => `
          <tr>
            <td>${r.component}</td>
            <td>${r.min}</td>
            <td>${r.recommended}</td>
          </tr>`).join('');
        reqSection = `
          <section>
            <div class="container">
              <div class="section-label">${t('requirementsLabel')}</div>
              <div class="section-title">${t('requirements')}</div>
              <div class="req-table-wrap">
                <table class="req-table">
                  <thead>
                    <tr>
                      <th>${t('component')}</th>
                      <th>${t('minimum')}</th>
                      <th>${t('recommended')}</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </section>`;
      }

      /* Logo */
      const logoHTML = data.logo
        ? `<div class="app-icon"><img src="${data.logo}" alt="${data.name} logo" /></div>`
        : `<div class="app-icon">${data.logo_emoji || '📦'}</div>`;

      /* Full HTML */
      const html = `
        <!-- HERO -->
        <section class="hero" style="border:none">
          <div class="container">
            <div class="hero-inner">
              ${logoHTML}
              <div class="hero-text">
                <div class="version-badge">
                  <span class="version-dot"></span>
                  ${data.version}
                </div>
                <h1 class="hero-title">${data.name}</h1>
                <p class="hero-desc">${data.description}</p>
                <div class="download-area">${buttonsHTML}</div>
                <div class="platforms-strip">
                  <span class="platforms-label">${t('platforms')}:</span>
                  ${chipsHTML}
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- FEATURES -->
        ${features ? `
        <section>
          <div class="container">
            <div class="section-label">${t('featuresLabel')}</div>
            <div class="section-title">${t('features')}</div>
            <div class="features-grid">${features}</div>
          </div>
        </section>` : ''}

        <!-- SCREENSHOTS -->
        ${screenshotsSection}

        <!-- REQUIREMENTS -->
        ${reqSection}

        <!-- FOOTER -->
        <footer>
          <div class="container">
            <div class="footer-inner">
              <span class="footer-copy">${data.footer || ''}</span>
            </div>
          </div>
        </footer>
      `;

      const app = document.getElementById('app');
      app.innerHTML = html;
      app.classList.add('loaded');
      document.getElementById('state-loading').style.display = 'none';
    }

    /* ──────────────────────────────────────────────────────────────────
       LOAD DATA
       Reads the URL hash (e.g. #diary) and fetches data/diary.json
       You can change the base path below.
    ────────────────────────────────────────────────────────────────── */
    const JSON_BASE_PATH = 'https://blockhunter0007.github.io/projects/'; // ← change this if your JSONs live elsewhere

    async function loadProduct() {
      const hash = window.location.hash.slice(1);

      if (!hash) {
        showError(t('noHash'), t('noHashBody'), 'No #hash in URL');
        return;
      }

      document.getElementById('loading-msg').textContent = t('loading');

      try {
        const res = await fetch(`${JSON_BASE_PATH}${hash}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderApp(data);
      } catch (err) {
        showError(t('fetchFail'), t('fetchFailBody'), err.message);
      }
    }

    function showError(title, body, detail) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display = 'flex';
      document.getElementById('err-title').textContent = title;
      document.getElementById('err-body').textContent = body;
      document.getElementById('err-detail').textContent = detail;
    }

    /* ──────────────────────────────────────────────────────────────────
       LIGHTBOX
    ────────────────────────────────────────────────────────────────── */
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    /* ──────────────────────────────────────────────────────────────────
       THEME
    ────────────────────────────────────────────────────────────────── */
    let currentTheme = localStorage.getItem('bh_theme') || 'dark';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('iconSun').style.display  = theme === 'dark'  ? '' : 'none';
      document.getElementById('iconMoon').style.display = theme === 'light' ? '' : 'none';
    }
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('bh_theme', currentTheme);
      applyTheme(currentTheme);
    }

    /* ──────────────────────────────────────────────────────────────────
       INIT
    ────────────────────────────────────────────────────────────────── */
    applyTheme(currentTheme);
    loadProduct();
    window.addEventListener('hashchange', () => {
      document.getElementById('app').innerHTML = '';
      document.getElementById('app').classList.remove('loaded');
      document.getElementById('state-loading').style.display = 'flex';
      loadProduct();
    });
  </script>
</body>
</html>
